; Source of Mana — headless dedicated-server overrides.
; Loaded by Godot from the executable's directory (or res://override.cfg).
; These settings apply to ANY run of this binary; keep them server-safe so the
; same export can also serve as a local client if ever needed.
;
; Baseline (debug/editor binary --headless --server, empty world):
;   RSS ~425 MB, CPU ~2.8% of one core, 0 SCRIPT ERROR.
; The release headless-server export is smaller (~225 MB per docs/M1-ISOLATION-CHECK.md).
; These overrides target the server path; the client export does not ship this file.

[application]

; 30 FPS is already enforced in code for --server (LauncherCommons.ServerMaxFPS).
; Keep it consistent here so a bare run (no --server) also stays at 30.
run/max_fps=30

[physics]

; Server tick rate matches ServerMaxFPS. ARPG combat judgement uses this tick,
; so do NOT lower it below 30 without re-running the arena acceptance suite.
common/physics_ticks_per_second=30
common/max_physics_steps_per_frame=1
2d/default_gravity=0
2d/solver/iterations=4

[rendering]

; Headless server needs no renderer. "dummy" is the no-op driver and is what
; the dedicated_server export already uses; set it explicitly for safety.
renderer/rendering_method="dummy"
driver/threads/thread_model=0

[audio]

; No audio device on a headless server.
driver/driver="Dummy"
